<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Relatório — Caçador de Anúncios</title>
  <style>
    @page { size: A4; margin: 14mm 12mm; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1e21; background: #f0f2f5; }
    .bar { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 10px 16px; background: #1c1e21; color: #fff; }
    .bar button { padding: 8px 14px; border: 0; border-radius: 6px; background: #1877f2; color: #fff;
                  font: inherit; font-weight: 600; cursor: pointer; }
    .page { max-width: 820px; margin: 16px auto; padding: 24px; background: #fff; border-radius: 10px; }
    h1 { font-size: 20px; margin: 0 0 2px; }
    .meta { color: #65676b; margin-bottom: 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { border: 1px solid #e4e6eb; border-radius: 8px; padding: 8px 10px; }
    .stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .k { font-size: 11px; color: #65676b; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 16px; }
    .chip { border-radius: 999px; padding: 2px 10px; background: #f0f2f5; font-weight: 600; font-size: 11px; }
    .chip.filter { background: #1877f2; color: #fff; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #65676b; margin: 18px 0 8px; }
    .ad { border: 1px solid #e4e6eb; border-left: 4px solid #b0b3b8; border-radius: 8px; padding: 10px 12px;
          margin-bottom: 10px; break-inside: avoid; page-break-inside: avoid; }
    .ad[data-v="escalado"] { border-left-color: #ff7a1a; }
    .ad[data-v="fora"] { border-left-color: #9b87f5; }
    .ad[data-v="teste"] { border-left-color: #6aa7ff; }
    .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .adv { font-weight: 700; font-size: 13px; }
    .verd { font-weight: 700; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 4px 0 6px; color: #444; }
    .tags b { color: #1c1e21; }
    .dots { color: #e4572e; letter-spacing: 1px; }
    .low { opacity: .6; font-style: italic; }
    .hook { font-weight: 600; margin: 4px 0; }
    .copy { color: #444; white-space: pre-wrap; }
    .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 11px; color: #65676b; }
    .foot a { color: #1877f2; text-decoration: none; word-break: break-all; }
    .empty { padding: 40px; text-align: center; color: #65676b; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .page { margin: 0; padding: 0; max-width: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span>🎯 Relatório pronto. No diálogo de impressão, escolha <b>Salvar como PDF</b>.</span>
    <button id="print">Salvar como PDF</button>
  </div>
  <div class="page" id="page"></div>
  <script src="report.js"></script>
</body>
</html>
